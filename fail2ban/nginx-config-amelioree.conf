# ==============================================================================
# CONFIGURATION NGINX AMÉLIORÉE ANTI-BOTS
# À placer dans /etc/nginx/sites-enabled/default
# ==============================================================================

# 1. Définir les bots à BLOQUER COMPLÈTEMENT (inutiles et dangereux)
map $http_user_agent $block_bad_bots {
    default 0;
    ~*GPTBot                1;  # OpenAI - très gourmand
    ~*MJ12bot               1;  # Majestic SEO - très agressif
    ~*SemrushBot            1;  # SEMrush - crawler marketing
    ~*AhrefsBot             1;  # Ahrefs - crawler SEO agressif
    ~*DotBot                1;  # Moz/OpenSite Explorer
    ~*PetalBot              1;  # Huawei bot
    ~*YandexBot             1;  # Yandex (sauf si vous visez la Russie)
    ~*Bytespider            1;  # ByteDance (TikTok)
    ~*DataForSeoBot         1;  # DataForSEO
}

# 2. Définir les bots à limiter SÉVÈREMENT (1 req toutes les 60 secondes pour Facebook)
map $http_user_agent $strict_bot_ip {
    default                 "";                  
    ~*facebookexternalagent $binary_remote_addr; 
    ~*meta-externalagent    $binary_remote_addr; 
    ~*amazonbot             $binary_remote_addr; 
    ~*tiktokspider          $binary_remote_addr;
}

# 3. Limites GÉNÉRALES (tout le monde sauf Google/Bing qui sont essentiels pour le SEO)
map $http_user_agent $general_ip {
    default                 $binary_remote_addr; 
    ~*googlebot             "";                  
    ~*bingbot               "";                  
}

# Zones de limitation
limit_req_zone $strict_bot_ip zone=strict_bots:10m rate=1r/m;       # 1 req/minute pour Facebook/Meta
limit_req_zone $general_ip zone=general_users:10m rate=10r/s;       # 10 req/sec pour les humains

# ==============================================================================
# SERVEURS
# ==============================================================================

#odoo server
upstream odoo {
  server 127.0.0.1:8069;
}
upstream odoochat {
  server 127.0.0.1:8072;
}
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# http -> https
server {
  listen 80;
  server_name infosaone.com;
  rewrite ^(.*) https://$host$1 permanent;
}

server {
  listen 443 ssl;
  server_name infosaone.com;
  
  # ==== BLOCAGES ====
  
  # Bloquer les bots inutiles IMMÉDIATEMENT
  if ($block_bad_bots) {
      return 403 "Bot blocked";
  }
  
  # Bloquer IPs malveillantes identifiées
  deny 59.126.247.219;
  deny 5.189.176.170;
  deny 78.153.140.156;
  deny 78.153.140.178;
  deny 45.139.104.171;
  deny 157.245.209.233;
  deny 194.150.220.102;
  deny 78.153.140.50;
  deny 176.65.149.253;     # Tentative accès .env
  deny 4.197.248.250;      # Tentatives .php multiples
  deny 52.169.5.4;         # Tentatives .php wordpress
  deny 52.169.206.229;     # Nombreuses erreurs
  deny 144.76.19.24;       # Nombreuses erreurs
  deny 216.244.66.242;     # Nombreuses erreurs
  deny 180.93.237.156;     # Nombreuses erreurs
  
  # Bloquer accès aux fichiers sensibles
  location ~ /\.(env|git|sql|bak|config) {
      deny all;
      return 404;
  }
  
  # Bloquer toutes les requêtes .php (vous utilisez Python/Odoo, pas PHP)
  location ~ \.php$ {
      deny all;
      return 404;
  }
  
  # ==== SSL & TIMEOUTS ====
  
  proxy_read_timeout 720s;
  proxy_connect_timeout 720s;
  proxy_send_timeout 720s;

  ssl_certificate /etc/letsencrypt/live/infosaone.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/infosaone.com/privkey.pem;

  ssl_session_timeout 30m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;

  # log
  access_log /var/log/nginx/odoo.access.log;
  error_log /var/log/nginx/odoo.error.log;

  # ==== WEBSOCKET ====
  
  location /websocket {
    proxy_pass http://odoochat;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    proxy_cookie_flags session_id samesite=lax secure;
  }

  # ==== LOCATION PRINCIPALE ====
  
  location / {
    # Rate limiting RENFORCÉ
    limit_req zone=strict_bots burst=1 nodelay;     # Facebook/Meta : tolérance minimale
    limit_req zone=general_users burst=20 nodelay;  # Humains : max 20 en attente
    limit_req_status 429;
    
    # Headers proxy Odoo
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;
    proxy_pass http://odoo;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    proxy_cookie_flags session_id samesite=lax secure;
  }

  # ==== AUTRES ROUTES ====
  
  location /contact {
    return 301 /nous-contacter;
  }

  location = /robots.txt {
    alias /var/www/html/robots.txt;
    access_log off;
    log_not_found off;
  }

  # ==== COMPRESSION ====
  
  gzip_types text/css text/scss text/plain text/xml application/xml application/json application/javascript;
  gzip on;
}

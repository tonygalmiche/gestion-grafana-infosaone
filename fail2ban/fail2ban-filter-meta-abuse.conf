# ==============================================================================
# FAIL2BAN - FILTRE POUR BLOQUER META/FACEBOOK
# Fichier : /etc/fail2ban/filter.d/nginx-meta-abuse.conf
# ==============================================================================
# Ce filtre détecte TOUTES les requêtes Meta/Facebook et les bloque rapidement

[Definition]

ignoreregex = 

failregex = ^<HOST>.*meta-externalagent.*$
            ^<HOST>.*facebookexternalagent.*$
            ^<HOST>.*FacebookBot.*$
            ^<HOST>.*facebookplatform.*$
            ^<HOST>.*facebot.*$

[INCLUDES]
before = common.conf

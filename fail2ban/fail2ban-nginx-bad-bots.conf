# ==============================================================================
# FAIL2BAN - FILTRE AMÉLIORÉ POUR NGINX
# Fichier : /etc/fail2ban/filter.d/nginx-bad-bots.conf
# ==============================================================================

[Definition]

# ========== IGNORER LES BOTS LÉGITIMES (SEO) ==========
ignoreregex = ^<HOST>.*(Googlebot|Bingbot|bingbot|Google-InspectionTool).*$

# ========== BANNIR LES COMPORTEMENTS SUSPECTS ==========
failregex = 
    # 1. Tentatives d'accès à des fichiers sensibles
    ^<HOST>.*"(GET|POST|HEAD|PUT|DELETE|OPTIONS).*\.(env|git|sql|bak|zip|tar|config|old|swp)".*" \d+
    
    # 2. Tentatives d'accès à des scripts PHP (site non-PHP)
    ^<HOST>.*"(GET|POST|HEAD).*\.php.*" \d+
    
    # 3. Erreurs 404 multiples (scanning)
    ^<HOST>.*" 404 
    
    # 4. Erreurs 403 (accès interdit)
    ^<HOST>.*" 403 
    
    # 5. Erreurs 400 (requêtes malformées)
    ^<HOST>.*" 400 
    
    # 6. Rate limiting dépassé (429)
    ^<HOST>.*" 429 
    
    # 7. Bots bloqués (403 avec message "Bot blocked")
    ^<HOST>.*"Bot blocked".*" 403
    
    # 8. Tentatives sur chemins admin suspects
    ^<HOST>.*"(GET|POST).*/(admin|wp-admin|wp-login|phpmyadmin|adminer|console).*" \d+
    
    # 9. User-agents suspects ou vides
    ^<HOST>.*"-".*" \d+
    ^<HOST>.*(sqlmap|nikto|nmap|masscan|zgrab|curl|wget|python-requests).*" \d+

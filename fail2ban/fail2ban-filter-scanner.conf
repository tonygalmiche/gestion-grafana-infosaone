# ==============================================================================
# FAIL2BAN - FILTRE POUR DÉTECTER LES SCANNERS
# Fichier : /etc/fail2ban/filter.d/nginx-scanner.conf
# ==============================================================================
# Ce filtre détecte les comportements de scanning (nombreuses URLs différentes)

[Definition]

# Ignorer les bots SEO légitimes
ignoreregex = ^<HOST>.*(Googlebot|Bingbot|bingbot|Google-InspectionTool).*$

# Détecter les scanners (requêtes vers /blog avec tags multiples = scanning)
failregex = ^<HOST>.*"GET /blog/.*tag/.*$
            ^<HOST>.*"GET /.*page/\d+.*$
            ^<HOST>.*" 302 
            ^<HOST>.*" 429 

[INCLUDES]
before = common.conf
